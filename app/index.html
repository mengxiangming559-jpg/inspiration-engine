<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>灵感引擎 Inspiration Engine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;

            background:
                radial-gradient(circle at top, #202020, #0b0b0b 55%);

            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: min(900px, 92%);
            padding: 40px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-top: 10px;
            color: #999;
            font-size: 15px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 28px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5);
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-size: 15px;
            color: #cccccc;
        }

        textarea {
            width: 100%;
            min-height: 180px;

            resize: vertical;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;

            padding: 18px;

            background: rgba(0, 0, 0, 0.35);

            color: white;

            font-size: 17px;
            line-height: 1.6;

            outline: none;
        }

        textarea:focus {
            border-color: rgba(255, 255, 255, 0.35);
        }

        button {
            width: 100%;

            margin-top: 18px;

            padding: 16px;

            border: none;
            border-radius: 12px;

            background: white;
            color: black;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .result {
            margin-top: 25px;

            padding: 20px;

            border-radius: 14px;

            background: rgba(0, 0, 0, 0.3);

            color: #cccccc;

            line-height: 1.7;

            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">🧠</div>

        <h1>灵感引擎</h1>

        <div class="subtitle">
            Inspiration Engine · AI Creative Workspace
        </div>

    </div>


    <div class="card">

        <label for="idea">
            💡 输入你的灵感
        </label>

        <textarea
            id="idea"
            placeholder="例如：

年轻人的迷茫

或者：

我想做一期关于大学生焦虑的视频">
        </textarea>


        <button onclick="generate()">
            ✨ 开始创作
        </button>


        <div id="result" class="result"></div>

    </div>


    <div class="footer">

        Inspiration Engine V1.3

    </div>

</div>


<script>

function generate() {

    const idea =
        document.getElementById("idea").value.trim();

    const result =
        document.getElementById("result");


    if (!idea) {

        alert("请先输入一个灵感。");

        return;
    }


    result.style.display = "block";


    result.innerHTML = `

        <strong>🧠 灵感已接收</strong>

        <br><br>

        当前灵感：

        <br>

        「${idea}」

        <br><br>

        <span style="color:#888;">
        AI 内容创作引擎正在准备中……
        </span>

        <br><br>

        下一阶段：

        <br>

        创作者档案 → 内容记忆 → AI → 完整内容方案

    `;
}

</script>

</body>

</html>
